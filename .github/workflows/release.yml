name: 설치 파일 만들기
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm test
      - run: xvfb-run --auto-servernum npx electron --no-sandbox scripts/lifecycle-smoke.cjs
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win, arch: x64 }
          - { os: macos-15, platform: mac, arch: arm64 }
          - { os: macos-15, platform: mac, arch: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: node scripts/prepare-engine.cjs ${{ matrix.arch }}
      - run: node scripts/verify-engine.cjs ${{ matrix.arch }}
      - run: npx electron scripts/lifecycle-smoke.cjs
      - run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ShimSynergy-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            배포/*.msi
            배포/*.pkg
      - name: 릴리스에 설치 파일 올리기
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            배포/*.msi
            배포/*.pkg
  source:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl --fail --location https://github.com/deskflow/deskflow/archive/refs/tags/v1.27.0.tar.gz --output Deskflow-1.27.0-corresponding-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: Deskflow-corresponding-source
          path: Deskflow-1.27.0-corresponding-source.tar.gz
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: Deskflow-1.27.0-corresponding-source.tar.gz
